<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/><title>Quest Chrono</title><link rel="stylesheet" href="styles.css"/></head><body>
<div id="alarm-banner" class="alarm-banner hidden"><span id="alarm-banner-text">TIME UP</span><button id="dismiss-alert-btn" class="btn btn-danger">DISMISS</button></div>
<header class="top-bar"><h1>QUEST CHRONO</h1><div class="top-controls"><button id="toggle-24h" class="chip-btn">24H</button><button id="toggle-seconds" class="chip-btn active">SEC</button><button id="toggle-ambient" class="chip-btn">AMBIENT</button><button id="test-sound-btn" class="chip-btn">CHIME</button></div></header>
<main class="dashboard">
<section class="card clock-card"><div class="row-between"><span class="label">LIVE CLOCK</span><span id="live-date" class="muted"></span></div><div class="clock-display"><span id="live-time">00:00:00</span><span id="live-ampm" class="ampm hidden">AM</span></div><div class="world-strip"><div class="pill"><span>LOCAL</span><b id="tz-local">--:--</b></div><div class="pill"><span>NEW YORK</span><b id="tz-ny">--:--</b></div><div class="pill"><span>TOKYO</span><b id="tz-tokyo">--:--</b></div><div class="pill"><span>UTC</span><b id="tz-utc">--:--</b></div></div></section>
<section class="card timers-card"><div class="row-between"><span class="label">TIMERS</span><div class="row"><button class="preset-btn" data-sec="60">+1m</button><button class="preset-btn" data-sec="300">+5m</button><button class="preset-btn" data-sec="1500">25m</button><button class="preset-btn" data-sec="2700">VR 45m</button></div></div><form id="custom-timer-form" class="row"><input id="timer-label-input" type="text" placeholder="Label"/><input id="timer-min-input" type="number" min="0" max="999" value="5"/><span class="muted">m</span><input id="timer-sec-input" type="number" min="0" max="59" value="0"/><span class="muted">s</span><button type="submit" class="btn btn-primary">+ ADD</button></form><div id="timers-list" class="list"></div></section>
<section class="card alarms-card"><div class="row-between"><span class="label">ALARMS</span></div><form id="alarm-form" class="row"><input id="alarm-time-input" type="time" required value="08:00"/><input id="alarm-label-input" type="text" placeholder="Alarm label"/><button type="submit" class="btn btn-primary">+ SET</button></form><div id="alarms-list" class="list"></div></section>
<section class="card sw-card"><div class="row-between"><span class="label">STOPWATCH</span><div class="row"><button id="sw-start-btn" class="btn btn-primary">START</button><button id="sw-lap-btn" class="btn btn-secondary" disabled>LAP</button><button id="sw-reset-btn" class="btn btn-secondary">RESET</button></div></div><div id="sw-display" class="sw-display">00:00.00</div><div id="sw-laps" class="row"></div></section>
</main><script src="app.js"></script></body></html>
